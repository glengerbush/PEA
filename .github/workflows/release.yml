name: Release desktop builds

# Push a tag like v0.7.0 and this builds + publishes:
#   Linux:  .AppImage (self-updating), .deb, .rpm
#   macOS:  .dmg for Apple Silicon (unsigned, see release notes)
# plus signed updater artifacts and latest.json for the in-app updater.
#
# No Intel macOS build: GitHub's macos-13 (Intel) hosted runners have become
# unreliable to schedule (jobs can queue for 24h with no runner allocated).
# Re-add a `macos-13` matrix entry (bundles: dmg,app) if Intel support returns.
#
# Required repo secret: TAURI_SIGNING_PRIVATE_KEY (contents of the minisign
# key generated with `pnpm tauri signer generate`; password empty).

on:
    push:
        tags:
            - 'v*'
    # Exercises the same signing/packaging path without creating a release.
    workflow_dispatch:

jobs:
    build:
        permissions:
            contents: write
            actions: read
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: ubuntu-22.04 # oldest glibc for AppImage compatibility
                      bundles: deb,rpm,appimage
                    - platform: macos-latest # Apple Silicon
                      bundles: dmg,app
        runs-on: ${{ matrix.platform }}
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v5
              with:
                  # Release notes compare this tag with the previous one.
                  fetch-depth: 0
                  persist-credentials: false

            # Fail fast if the tag and the committed version disagree. tauri.conf.json
            # reads its version from the root package.json, so package.json is the
            # source of truth; a v1.2.0 tag on a commit still at 1.1.0 would ship a
            # release whose in-app updater never fires. Bump with scripts/set-version.mjs.
            - name: Verify tag matches package.json version
              if: github.event_name == 'push'
              shell: bash
              run: |
                  tag="${GITHUB_REF_NAME#v}"
                  pkg="$(node -p "require('./package.json').version")"
                  if [ "$tag" != "$pkg" ]; then
                    echo "::error::Git tag v$tag does not match package.json version $pkg. Run 'node scripts/set-version.mjs $tag', commit, and re-tag."
                    exit 1
                  fi
                  echo "✓ Tag and package.json agree on $pkg"

            - name: Check artifact handoff and build fallback
              run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_desktop_release.py'

            - name: Restore verified inputs from the same main-branch revision
              id: prebuilt
              env:
                  GH_TOKEN: ${{ github.token }}
                  PEA_PLATFORM: ${{ runner.os }}-${{ runner.arch }}
                  PEA_JOB_NAME: build (${{ matrix.platform }})
              run: python3 scripts/desktop-artifact.py fetch --platform "$PEA_PLATFORM" --job-name "$PEA_JOB_NAME"

            - uses: ./.github/actions/desktop-build
              with:
                  prebuilt: ${{ steps.prebuilt.outputs.restored || 'false' }}

            - name: Generate release notes from commits
              if: github.event_name == 'push'
              id: release_notes
              shell: bash
              run: |
                  previous_tag="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
                  if [ -n "$previous_tag" ]; then
                    range="$previous_tag..$GITHUB_REF_NAME"
                  else
                    range="$GITHUB_REF_NAME"
                  fi

                  {
                    echo 'body<<RELEASE_NOTES_EOF'
                    git log "$range" --no-merges --pretty=format:'%s%n%b' |
                      awk 'NF { sub(/^[[:space:]]*[-*][[:space:]]+/, ""); print "- " $0 }'
                    echo
                    echo 'RELEASE_NOTES_EOF'
                  } >> "$GITHUB_OUTPUT"

            - name: Benchmark packaging without publication
              if: github.event_name == 'workflow_dispatch'
              working-directory: apps/desktop
              env:
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
                  APPIMAGE_EXTRACT_AND_RUN: 1
                  PEA_PREBUILT: ${{ steps.prebuilt.outputs.restored || 'false' }}
                  PEA_BUNDLES: ${{ matrix.bundles }}
              run: python3 ../../scripts/tauri-release.py build --verbose --bundles "$PEA_BUNDLES" -- --locked

            - name: Build and publish with Tauri
              if: github.event_name == 'push'
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
                  # lets linuxdeploy run without FUSE (also required on FUSE-less hosts)
                  APPIMAGE_EXTRACT_AND_RUN: 1
                  PEA_PREBUILT: ${{ steps.prebuilt.outputs.restored || 'false' }}
              with:
                  projectPath: apps/desktop
                  tauriScript: python3 ../../scripts/tauri-release.py
                  tagName: ${{ github.ref_name }}
                  releaseName: 'PEA ${{ github.ref_name }}'
                  releaseBody: ${{ steps.release_notes.outputs.body }}
                  releaseDraft: true
                  prerelease: false
                  includeUpdaterJson: true
                  args: --bundles ${{ matrix.bundles }} -- --locked
