name: Prepare desktop release inputs

on:
    push:
        branches: [main]
        paths:
            - 'Cargo.toml'
            - 'Cargo.lock'
            - 'crates/**'
            - 'apps/desktop/**'
            - 'packages/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - 'tsconfig*.json'
            - 'scripts/build-desktop-bundle.mjs'
            - 'scripts/desktop-artifact.py'
            - 'scripts/tauri-release.py'
            - 'scripts/test_desktop_release.py'
            - '.github/actions/desktop-build/**'
            - '.github/workflows/release.yml'
            - '.github/workflows/warm-desktop-cache.yml'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: desktop-cache-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        if: github.ref == 'refs/heads/main'
        strategy:
            fail-fast: false
            matrix:
                platform: [ubuntu-22.04, macos-latest]
        runs-on: ${{ matrix.platform }}
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v5
              with:
                  persist-credentials: false
            - name: Check artifact handoff and build fallback
              run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_desktop_release.py'
            - uses: ./.github/actions/desktop-build
            # Use Tauri's release flags, including custom-protocol, so Cargo
            # artifacts match the tagged builds. No bundles, signing or uploads.
            - name: Compile the release executable without publishing
              working-directory: apps/desktop
              run: pnpm tauri build --no-bundle -- --locked
            - name: Archive exact-revision executable and frontend resources
              env:
                  PEA_PLATFORM: ${{ runner.os }}-${{ runner.arch }}
              run: python3 scripts/desktop-artifact.py create --platform "$PEA_PLATFORM" --archive "$RUNNER_TEMP/desktop-inputs.tar.gz"
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: desktop-inputs-${{ github.sha }}-${{ runner.os }}-${{ runner.arch }}
                  path: ${{ runner.temp }}/desktop-inputs.tar.gz
                  compression-level: 0
                  if-no-files-found: error
                  overwrite: true
                  retention-days: 14
